runner:
  total_rounds: 1
  no_warm: true
  log_requests: true
  assert_invalid: true
  assert_error: true
requests:
  - sleep:
      sleep_in_milli_seconds: 15000
  - request:
      method: GET
      url: http://$[[env.GATEWAY_FLOATING_IP_HOST]]:8001/test
    assert:
      equals:
        _ctx.response.status: 200
        _ctx.response.body: 'ok'
