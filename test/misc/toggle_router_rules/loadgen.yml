env:
  LR_GATEWAY_HOST1: 127.0.0.1:8001
  LR_GATEWAY_HOST2: 127.0.0.1:8002
  LR_GATEWAY_HOST3: 127.0.0.1:8003
  LR_GATEWAY_HOST4: 127.0.0.1:8004
  LR_GATEWAY_API_HOST: 127.0.0.1:9000

runner:
  total_rounds: 1
  no_warm: true
  log_requests: true
  assert_invalid: true
  assert_error: true
requests:
  - request:
      method: GET
      url: http://$[[env.LR_GATEWAY_HOST1]]/
    assert:
      and:
        - equals:
            _ctx.response.status: 200
        - equals:
            _ctx.response.body: 'hello world'
  - request:
      method: GET
      url: http://$[[env.LR_GATEWAY_HOST2]]/_hello
    assert:
      and:
        - equals:
            _ctx.response.status: 200
        - equals:
            _ctx.response.body: 'hello toggled'
  - request:
      method: GET
      url: http://$[[env.LR_GATEWAY_HOST3]]/
    assert:
      and:
        - equals:
            _ctx.response.status: 200
        - equals:
            _ctx.response.body: 'hello world'
  - request:
      method: GET
      url: http://$[[env.LR_GATEWAY_HOST4]]/_hello
    assert:
      and:
        - equals:
            _ctx.response.status: 200
        - equals:
            _ctx.response.body: 'hello world'
