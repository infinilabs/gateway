env:
  LR_GATEWAY_HOST: 127.0.0.1:8001

runner:
  total_rounds: 1
  no_warm: true
  log_requests: true
  assert_invalid: true
  assert_error: true
  disable_header_names_normalizing: true
requests:
  - request:
      method: GET
      url: http://$[[env.LR_GATEWAY_HOST]]/
    assert:
      and:
        - equals:
            _ctx.response.status: 200
        - exists:
            - _ctx.response.body_json.tagline
