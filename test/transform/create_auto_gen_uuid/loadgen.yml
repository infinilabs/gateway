env:
  LR_GATEWAY_HOST: 127.0.0.1:8001

runner:
  total_rounds: 1
  no_warm: true
  log_requests: true
  assert_invalid: true
  assert_error: true
requests:
  - request:
      method: POST
      url: http://$[[env.LR_GATEWAY_HOST]]/index/doc/
    assert:
      and:
        - equals:
            _ctx.response.status: 200
        - contains:
            _ctx.response.body: '/index/doc/'
        - range:
            _ctx.response.body_length.gte: 27
  - request:
      method: POST
      url: http://$[[env.LR_GATEWAY_HOST]]/index/_create/
    assert:
      and:
        - equals:
            _ctx.response.status: 200
        - range:
            _ctx.response.body_length.gte: 27
  - request:
      method: POST
      url: http://$[[env.LR_GATEWAY_HOST]]/index/_doc/
    assert:
      and:
        - equals:
            _ctx.response.status: 200
        - range:
            _ctx.response.body_length.gte: 27
#        - equals:
#            _ctx.response.body: "/index/_doc/$[[_ctx.response.header.X-Generated-ID]]"
