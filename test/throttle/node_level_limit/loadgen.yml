env:
  LR_GATEWAY_HOST: 127.0.0.1:8001
  LR_GATEWAY_API_HOST: 127.0.0.1:9000
  ELASTICSEARCH_ENDPOINT: http://127.0.0.1:9200
runner:
  total_rounds: 1
  no_warm: true
  log_requests: true
  assert_invalid: true
  assert_error: true
requests:
  # With max_qps_per_node=1 the limiter starts with a full bucket, so the
  # first request passes immediately; every later request is throttled and
  # sleeps ~1s before its token is refilled.
  - request:
      method: POST
      url: http://$[[env.LR_GATEWAY_HOST]]/_bulk
      body: |
        { "create" : { "_index" : "test1", "_id" : "1" } }
        { "field1" : "value3" }
    assert:
      equals:
        _ctx.response.status: 200
  - request:
      method: POST
      url: http://$[[env.LR_GATEWAY_HOST]]/_bulk
      body: |
        { "create" : { "_index" : "test1", "_id" : "2" } }
        { "field1" : "value3" }
    assert:
      and:
        - equals:
            _ctx.response.status: 200
        - range:
            _ctx.elapsed.gte: 1000
  - request:
      method: DELETE
      url: http://$[[env.LR_GATEWAY_HOST]]/test1
    assert:
      and:
        - equals:
            _ctx.response.status: 200
        - range:
            _ctx.elapsed.gte: 1000
